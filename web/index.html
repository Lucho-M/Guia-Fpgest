<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía FPGEST Cascio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de módulos (como el árbol de carpetas del GEST) + ficha de guía con datos clave arriba y pasos con captura debajo */
:root {
  --bg: #f3f5f7;          /* aluminio claro */
  --surface: #ffffff;
  --sunken: #e8ecf0;
  --line: #d3d9e0;
  --fg: #18212b;
  --muted: #5a6673;
  --accent: #1d5f8a;      /* azul de vidrio templado */
  --accent-soft: #dcebf5;
  --bronze: #9a5a24;      /* anodizado bronce: Procedimiento */
  --bronze-soft: #f4e6d8;
  --warn: #a2321f;
  --warn-soft: #f8e3df;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --surface: #1a2129; --sunken: #232c36; --line: #313c48; --fg: #e4e9ee; --muted: #9aa7b4;
  --accent: #6db3e0; --accent-soft: #1d3446; --bronze: #e0a36c; --bronze-soft: #3a2a1c; --warn: #ef8a76; --warn-soft: #3d221d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1a2129; --sunken: #232c36; --line: #313c48; --fg: #e4e9ee; --muted: #9aa7b4;
  --accent: #6db3e0; --accent-soft: #1d3446; --bronze: #e0a36c; --bronze-soft: #3a2a1c; --warn: #ef8a76; --warn-soft: #3d221d; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100%; }

/* ---------- barra lateral ---------- */
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand .brand-mark { flex: none; width: 38px; height: 38px; border-radius: 6px; background: var(--accent); color: var(--surface);
  display: grid; place-items: center; font: 700 13px/1 var(--font-display); letter-spacing: .04em; }
.brand b { display: block; font: 700 18px/1.1 var(--font-display); }
.brand span { font-size: 12px; color: var(--muted); }
.search { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
.nav-label { font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 6px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.mod-btn { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left;
  padding: 7px 9px; border: 0; border-radius: 5px; background: none; cursor: pointer; font-weight: 500; }
.mod-btn:hover { background: var(--sunken); }
.mod-btn.off { color: var(--muted); font-weight: 400; }
.mod-btn .count { font: 500 12px var(--font-mono); color: var(--muted); }
.mod-btn .soon { font-size: 11px; color: var(--muted); }
.sub { display: flex; flex-direction: column; gap: 1px; margin: 2px 0 6px 10px; border-left: 1px solid var(--line); padding-left: 6px; }
.guide-link { text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; color: var(--fg); }
.guide-link:hover { background: var(--sunken); }
.guide-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

/* ---------- contenido ---------- */
.main { min-width: 0; padding-block: 28px 60px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.wrap { max-width: 980px; display: flex; flex-direction: column; gap: 22px; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }

.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .07em;
  padding: 5px 9px; border-radius: 3px; }
.chip.Instructivo { background: var(--accent-soft); color: var(--accent); }
.chip.Procedimiento { background: var(--bronze-soft); color: var(--bronze); }
.sector { display: inline-block; font-size: 13px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
button.sector { cursor: pointer; }
button.sector[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.g-head { display: flex; flex-direction: column; gap: 10px; }
.g-head h1 { font-size: clamp(28px, 4vw, 38px); }
.lead { font-size: 17px; color: var(--muted); max-width: 65ch; margin: 0; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fact { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fact dt { font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fact dd { margin: 0; }
.fact .sectors { display: flex; flex-wrap: wrap; gap: 5px; }

section h2 { font-size: 21px; margin-bottom: 12px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.rules li { background: var(--bronze-soft); border-radius: 6px; padding: 10px 14px 10px 14px; max-width: 80ch; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: paso; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 14px; }
.step::before { counter-increment: paso; content: counter(paso); grid-row: span 3; width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent); color: var(--surface); display: grid; place-items: center; font: 700 15px var(--font-display); }
.step h3 { font-size: 17px; }
.step p { margin: 0; max-width: 72ch; }
.shot { margin: 10px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; cursor: zoom-in; display: block; width: 100%; }
.shot img { display: block; width: 100%; height: auto; max-height: 460px; object-fit: contain; object-position: left top; }

.errs { display: flex; flex-direction: column; gap: 10px; }
.err { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.err .q { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; font-weight: 600; }
.err .a { padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.a-label { font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.related { display: flex; flex-wrap: wrap; gap: 8px; }
.rel-btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 6px; cursor: pointer; text-align: left; }
.rel-btn:hover { border-color: var(--accent); }
.source { font: 13px var(--font-mono); color: var(--muted); }

/* ---------- inicio ---------- */
.hello h1 { font-size: clamp(30px, 4.5vw, 44px); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.glist { display: flex; flex-direction: column; }
.grow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line);
  border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.grow:first-child { border-top: 0; }
.grow:hover b { color: var(--accent); }
.grow b { font-weight: 600; }
.grow small { color: var(--muted); grid-column: 1; }
.grow .chip { grid-row: 1 / span 2; grid-column: 2; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mod-card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; }
.mod-card:hover { border-color: var(--accent); }
.mod-card.off { background: transparent; border-style: dashed; cursor: default; }
.mod-card b { font: 600 16px var(--font-display); }
.mod-card small { color: var(--muted); }
.mod-card .pg { font: 12px var(--font-mono); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--muted); align-items: center; }
.empty { color: var(--muted); padding: 10px 4px; }

/* ---------- visor de imagen ---------- */
.viewer { position: fixed; inset: 0; background: rgba(10, 14, 18, .88); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 4px; }

.menu-toggle { display: none; }

/* ---------- propuestas ---------- */
.prop-link { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 10px; border: 1px dashed var(--accent); border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); font-weight: 600; cursor: pointer; }
.prop-link.active { border-style: solid; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
.field textarea { min-height: 110px; resize: vertical; }
.kinds { display: flex; flex-wrap: wrap; gap: 8px; }
.kind { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; background: var(--surface); cursor: pointer; }
.field .kind { font: 15px/1.3 var(--font-body); text-transform: none; letter-spacing: 0; color: var(--fg); }
.field .kind input { width: auto; margin: 0; accent-color: var(--accent); }
.field.actions { flex-direction: row; }
.kind:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.preview { font: 13px/1.5 var(--font-mono); white-space: pre-wrap; background: var(--sunken); border-radius: 6px; padding: 12px; user-select: all; overflow-x: auto; }
.status-ok { color: var(--accent); font-weight: 600; }
.road { display: flex; flex-direction: column; }
.road-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 4px; border-top: 1px solid var(--line); }
.road-row:first-child { border-top: 0; }
.road-row small { color: var(--muted); }
.state { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .07em; padding: 5px 9px; border-radius: 3px; background: var(--sunken); color: var(--muted); }
.state.en-curso { background: var(--accent-soft); color: var(--accent); }
.state.hecha { background: var(--fg); color: var(--bg); }
.okbox { background: var(--accent-soft); border-radius: 6px; padding: 12px 14px; }
.okbox.warn { background: var(--bronze-soft); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 90px; }
.tbl td:nth-child(2) { min-width: 260px; }
.tbl .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl select { padding: 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--fg); font: inherit; }
.guide-prop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side .nav, .side .nav-label.mods-label, .side-foot { display: none; }
  .side.open .nav, .side.open .nav-label.mods-label { display: flex; }
  .menu-toggle { display: inline-block; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .facts, .form { grid-template-columns: minmax(0, 1fr); }
  .step { grid-template-columns: minmax(0, 1fr); }
  .step::before { grid-row: auto; }
}
@media (prefers-reduced-motion: no-preference) { .mod-card, .rel-btn, .grow b { transition: border-color .15s, color .15s; } }
</style>
</head>
<body>


<div class="app">
  <aside class="side" id="side">
    <div class="top-row">
      <button class="brand" id="home-btn" type="button" aria-label="Ir al inicio">
        <span class="brand-mark">GEST</span>
        <span><b>Guía FPGEST</b><span>Instructivos y procedimientos · Cascio</span></span>
      </button>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false">Módulos</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Buscar: remito, kg, devolución…" autocomplete="off">
    <div class="nav-label mods-label">Módulos</div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <button class="prop-link" id="prop-link" type="button" data-go="propuestas">＋ Proponer una mejora</button>
    <div class="side-foot" id="foot"></div>
  </aside>

  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<div class="viewer" id="viewer" hidden><img id="viewer-img" alt=""></div>

<script src="datos.js"></script>
<script>
(function () {
  const D = window.GUIA_FPGEST;
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  const search = document.getElementById('search');
  let sectorFilter = null;
  let propPrefill = null;
  const P = D.propuestas || { plan: [] };
  // Registro: funciona cuando la guía se abre desde el servidor (http://servidor:8080)
  const API = '/api/propuestas';
  let registro = null; // null = sin verificar, true/false
  async function hayRegistro() {
    if (registro !== null) return registro;
    if (!/^https?:$/.test(location.protocol)) return (registro = false);
    try { const r = await fetch(API, { cache: 'no-store' }); registro = r.ok && (r.headers.get('content-type') || '').includes('json'); }
    catch (_) { registro = false; }
    return registro;
  }

  if (!D) { view.innerHTML = '<p class="empty">No se encontró <b>datos.js</b>. Tiene que estar en la misma carpeta que esta página.</p>'; return; }

  // índice plano de guías
  const all = [];
  D.modulos.forEach(m => m.guias.forEach(g => all.push(Object.assign({ modulo: m }, g))));
  const byId = Object.fromEntries(all.map(g => [g.id, g]));
  const strip = s => (s || '').replace(/<[^>]+>/g, '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  document.getElementById('foot').innerHTML =
    `Versión ${esc(D.version)} · actualizada ${esc(D.actualizado)}<br>Fuente: ${esc(D.fuente)}` + (D.autor ? `<br>Autor: ${esc(D.autor)}` : '');

  function renderNav(activeId) {
    nav.innerHTML = '';
    document.getElementById('prop-link').classList.toggle('active', activeId === 'propuestas');
    D.modulos.forEach(m => {
      const on = m.guias.length > 0;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'mod-btn' + (on ? '' : ' off');
      b.innerHTML = `<span>${esc(m.titulo)}</span>` + (on ? `<span class="count">${m.guias.length}</span>` : `<span class="soon">pronto</span>`);
      b.onclick = () => go(on ? 'm-' + m.id : 'm-' + m.id);
      nav.appendChild(b);
      if (on) {
        const sub = document.createElement('div');
        sub.className = 'sub';
        m.guias.forEach(g => {
          const l = document.createElement('button');
          l.type = 'button';
          l.className = 'guide-link' + (g.id === activeId ? ' active' : '');
          l.textContent = g.titulo;
          l.onclick = () => go(g.id);
          sub.appendChild(l);
        });
        nav.appendChild(sub);
      }
    });
  }

  function guideRow(g) {
    return `<button class="grow" type="button" data-go="${g.id}"><b>${esc(g.titulo)}</b><span class="chip ${g.tipo}">${g.tipo}</span><small>${esc(g.modulo.titulo)} · ${esc(g.responsable)}</small></button>`;
  }

  function renderHome() {
    const q = strip(search.value.trim());
    let list = all;
    if (q) list = list.filter(g => strip([g.titulo, g.resumen, g.responsable, g.sectores.join(' '), g.reglas.join(' '),
      g.pasos.map(p => p.titulo + ' ' + p.texto).join(' '), (g.errores || []).map(e => e.problema + ' ' + e.solucion).join(' ')].join(' ')).includes(q));
    if (sectorFilter) list = list.filter(g => g.responsable.includes(sectorFilter) || g.sectores.includes(sectorFilter));

    view.innerHTML = `
      <div class="hello g-head">
        <h1>¿Qué necesitás hacer hoy en el GEST?</h1>
        <p class="lead">Cada guía dice quién lo hace, cuándo, a qué sectores afecta y los pasos con la pantalla del sistema.</p>
        <div class="legend"><span class="chip Procedimiento">Procedimiento</span> qué, quién y cuándo
          <span class="chip Instructivo">Instructivo</span> cómo se hace en el sistema</div>
      </div>
      <div class="panel">
        <div class="nav-label">Ver por sector</div>
        <div class="filters">${D.sectores.map(s => `<button type="button" class="sector" data-sector="${esc(s)}" aria-pressed="${sectorFilter === s}">${esc(s)}</button>`).join('')}</div>
        <div class="glist">${list.length ? list.map(guideRow).join('') : `<p class="empty">No hay guías ${q ? 'que coincidan con «' + esc(search.value) + '»' : 'para este sector todavía'}.</p>`}</div>
      </div>
      <section>
        <h2>Módulos</h2>
        <div class="mods">${D.modulos.map(m => m.guias.length
          ? `<button class="mod-card" type="button" data-go="m-${m.id}"><b>${esc(m.titulo)}</b><small>${esc(m.descripcion)}</small><span class="pg">${m.guias.length} guías</span></button>`
          : `<div class="mod-card off"><b>${esc(m.titulo)}</b><small>${esc(m.descripcion)}</small><span class="pg">En preparación · manual págs. ${esc(m.paginas)}</span></div>`).join('')}</div>
      </section>
      <div class="panel guide-prop" style="border-top:1px solid var(--line)">
        <div><b>¿Falta algo?</b><p class="hint">Contanos qué necesitás ver o hacer en el GEST y lo sumamos en la próxima versión.</p></div>
        <button class="btn" type="button" data-go="propuestas">Proponer una mejora</button>
      </div>`;
    renderNav(null);
  }

  function renderModule(m) {
    view.innerHTML = `
      <div class="crumbs"><button type="button" data-go="">Inicio</button><span>/</span><span>${esc(m.titulo)}</span></div>
      <div class="g-head"><h1>${esc(m.titulo)}</h1><p class="lead">${esc(m.descripcion)}</p></div>
      ${m.guias.length ? `<div class="panel"><div class="glist">${m.guias.map(g => guideRow(byId[g.id])).join('')}</div></div>`
        : `<div class="panel"><p class="empty">Este módulo está en preparación. Contenido en el manual, págs. ${esc(m.paginas)}.</p></div>`}`;
    renderNav(null);
  }

  function renderGuide(g) {
    const steps = g.pasos.map(p => `
      <li class="step"><h3>${esc(p.titulo)}</h3><p>${p.texto}</p>
        ${p.img ? `<button class="shot" type="button" data-img="${esc(p.img)}" aria-label="Ampliar captura"><img src="${esc(p.img)}" alt="Pantalla del GEST: ${esc(p.titulo)}" loading="lazy"></button>` : ''}
      </li>`).join('');
    view.innerHTML = `
      <div class="crumbs"><button type="button" data-go="">Inicio</button><span>/</span><button type="button" data-go="m-${g.modulo.id}">${esc(g.modulo.titulo)}</button></div>
      <div class="g-head"><span><span class="chip ${g.tipo}">${g.tipo}</span></span><h1>${esc(g.titulo)}</h1><p class="lead">${esc(g.resumen)}</p></div>
      <dl class="facts">
        <div class="fact"><dt>Responsable</dt><dd>${esc(g.responsable)}</dd></div>
        <div class="fact"><dt>Cuándo</dt><dd>${esc(g.cuando)}</dd></div>
        <div class="fact"><dt>Sectores afectados</dt><dd class="sectors">${g.sectores.map(s => `<span class="sector">${esc(s)}</span>`).join('')}</dd></div>
      </dl>
      ${g.reglas.length ? `<section><h2>Reglas</h2><ul class="rules">${g.reglas.map(r => `<li>${r}</li>`).join('')}</ul></section>` : ''}
      <section><h2>Pasos</h2><ol class="steps">${steps}</ol></section>
      ${g.errores && g.errores.length ? `<section><h2>Errores frecuentes</h2><div class="errs">${g.errores.map(e => `<div class="err"><div class="q">${esc(e.problema)}</div><div class="a"><span class="a-label">Cómo solucionarlo</span>${esc(e.solucion)}</div></div>`).join('')}</div></section>` : ''}
      ${g.relacionados && g.relacionados.length ? `<section><h2>Guías relacionadas</h2><div class="related">${g.relacionados.filter(id => byId[id]).map(id => `<button class="rel-btn" type="button" data-go="${id}">${esc(byId[id].titulo)}</button>`).join('')}</div></section>` : ''}
      <div class="guide-prop">
        <p class="source">Manual «Implementación del ERP GEST», ${esc(g.fuente)}</p>
        <button class="btn ghost" type="button" data-prop-guia="${g.id}">¿Algo para corregir o agregar? Proponer mejora</button>
      </div>`;
    renderNav(g.id);
  }

  const TIPOS = [
    ['ver', 'Necesito ver una guía de…'],
    ['hacer', 'Necesito poder hacer…'],
    ['corregir', 'Hay un error en una guía'],
    ['otra', 'Otra mejora']
  ];
  const ESTADOS = { 'planificada': 'Planificada', 'en-curso': 'En curso', 'hecha': 'Hecha' };

  function renderPropuestas() {
    const pre = propPrefill || {};
    propPrefill = null;
    if (P.formulario) { renderPropuestasFormulario(pre); return; }
    const guideOpts = D.modulos.map(m => m.guias.length
      ? `<optgroup label="${esc(m.titulo)}">${m.guias.map(g => `<option value="${esc(g.titulo)}"${pre.guia === g.id ? ' selected' : ''}>${esc(g.titulo)}</option>`).join('')}</optgroup>`
      : `<option value="Módulo ${esc(m.titulo)}">Módulo ${esc(m.titulo)} (en preparación)</option>`).join('');
    const plan = P.plan || [];
    view.innerHTML = `
      <div class="crumbs"><button type="button" data-go="">Inicio</button><span>/</span><span>Propuestas de mejora</span></div>
      <div class="g-head"><h1>Propuestas de mejora</h1>
        <p class="lead">¿Qué necesitás ver o hacer en el GEST que todavía no está en la guía? ¿Encontraste algo mal? Escribilo acá y se tiene en cuenta para la próxima actualización.</p></div>
      <form class="panel form" id="prop-form" novalidate>
        <div class="field full"><label>Qué tipo de propuesta es</label>
          <div class="kinds">${TIPOS.map(([v, t], i) => `<label class="kind"><input type="radio" name="tipo" value="${v}"${(pre.tipo ? pre.tipo === v : i === 0) ? ' checked' : ''}> ${t}</label>`).join('')}</div></div>
        <div class="field"><label for="p-nombre">Tu nombre</label><input id="p-nombre" autocomplete="name"></div>
        <div class="field"><label for="p-sector">Tu sector</label><select id="p-sector"><option value="">Elegí…</option>${D.sectores.map(s => `<option>${esc(s)}</option>`).join('')}<option>Otro</option></select></div>
        <div class="field full"><label for="p-guia">Sobre qué guía o módulo (opcional)</label><select id="p-guia"><option value="">Ninguno en particular</option>${guideOpts}</select></div>
        <div class="field full"><label for="p-desc">Contalo con tus palabras</label>
          <textarea id="p-desc" placeholder="Ej.: Necesito una guía para cargar un remito de venta a obra. Hoy no sé qué justificante elegir."></textarea></div>
        <div class="field"><label for="p-prio">¿Qué tan importante es?</label><select id="p-prio">
          <option>Me frena el trabajo</option><option selected>Lo hago seguido</option><option>Sería útil</option></select></div>
        <div class="field full actions">
          <button class="btn" type="submit" id="p-submit">Registrar propuesta</button>
          <span class="hint" id="p-msg"></span>
        </div>
        <div class="field full" id="p-ok" hidden>
          <div class="okbox"><b>Propuesta registrada.</b> <span id="p-ok-txt"></span></div>
          <div class="actions"><button class="btn ghost" type="button" id="p-new">Registrar otra</button></div>
        </div>
        <div class="field full" id="p-out" hidden>
          <div class="okbox warn"><b>Esta copia de la guía no está conectada al registro.</b> Abrila desde el servidor (${esc(P.direccion || 'http://SERVIDOR:8080')}) para que la propuesta quede guardada, o copiá el texto y pasáselo al responsable de la guía.</div>
          <div class="preview" id="p-text"></div>
          <div class="actions">
            <button class="btn ghost" type="button" id="p-copy">Copiar texto</button>
            <span class="hint" id="p-copied"></span>
          </div>
        </div>
      </form>
      <div class="panel guide-prop" id="p-bandeja-link" hidden>
        <div><b>Propuestas registradas</b><p class="hint" id="p-count"></p></div>
        <button class="btn ghost" type="button" data-go="bandeja">Ver bandeja</button>
      </div>
      <section><h2>Próximas actualizaciones</h2>
        <div class="panel">${plan.length ? `<div class="road">${plan.map(r => `<div class="road-row"><b>${esc(r.titulo)}</b><span class="state ${esc(r.estado)}">${esc(ESTADOS[r.estado] || r.estado)}</span><small>${esc(r.detalle || '')}${r.pedido ? ' · Pedido por ' + esc(r.pedido) : ''}</small></div>`).join('')}</div>`
          : `<p class="empty">Todavía no hay mejoras planificadas. Las propuestas aceptadas van a aparecer acá.</p>`}</div>
      </section>`;
    renderNav('propuestas');

    const f = document.getElementById('prop-form');
    if (pre.guia) document.getElementById('p-desc').focus();
    hayRegistro().then(ok => { if (!ok) return; fetch(API, { cache: 'no-store' }).then(r => r.json()).then(d => {
      const n = d.propuestas.length, abiertas = d.propuestas.filter(x => !['Hecha', 'Descartada'].includes(x.estado)).length;
      document.getElementById('p-count').textContent = `${n} en total · ${abiertas} sin resolver`;
      document.getElementById('p-bandeja-link').hidden = false; }).catch(() => {}); });

    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const desc = document.getElementById('p-desc').value.trim();
      const msg = document.getElementById('p-msg');
      if (!desc) { msg.textContent = 'Falta contar la propuesta en el cuadro de texto.'; document.getElementById('p-desc').focus(); return; }
      msg.textContent = '';
      const datos = {
        tipo: TIPOS.find(t => t[0] === f.querySelector('input[name="tipo"]:checked').value)[1].replace('…', ''),
        nombre: document.getElementById('p-nombre').value.trim(),
        sector: document.getElementById('p-sector').value,
        guia: document.getElementById('p-guia').value || 'General',
        importancia: document.getElementById('p-prio').value,
        descripcion: desc,
        version_guia: D.version
      };
      if (await hayRegistro()) {
        const btn = document.getElementById('p-submit'); btn.disabled = true; msg.textContent = 'Guardando…';
        try {
          const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
          if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Error ' + r.status);
          const res = await r.json();
          msg.textContent = '';
          document.getElementById('p-ok-txt').textContent = `Quedó con el número ${res.propuesta.id}. La vas a ver en «Próximas actualizaciones» cuando se incorpore.`;
          document.getElementById('p-ok').hidden = false;
          f.querySelectorAll('.field:not(#p-ok)').forEach(el => { if (!el.contains(document.getElementById('p-ok'))) el.hidden = true; });
        } catch (err) { msg.textContent = 'No se pudo guardar: ' + err.message + '. Probá de nuevo en un momento.'; }
        btn.disabled = false;
        return;
      }
      const text = `PROPUESTA DE MEJORA – Guía FPGEST (v${D.version})\nFecha: ${new Date().toLocaleDateString('es-AR')}\nDe: ${datos.nombre || '(sin nombre)'} – ${datos.sector || '(sin sector)'}\nTipo: ${datos.tipo}\nGuía / módulo: ${datos.guia}\nImportancia: ${datos.importancia}\n\n${desc}`;
      document.getElementById('p-text').textContent = text;
      document.getElementById('p-out').hidden = false;
      document.getElementById('p-copied').textContent = '';
      document.getElementById('p-out').scrollIntoView({ block: 'nearest' });
    });
    document.getElementById('p-new').onclick = () => renderPropuestas();
    document.getElementById('p-copy').onclick = () => {
      const t = document.getElementById('p-text');
      const done = ok => { document.getElementById('p-copied').textContent = ok ? 'Copiado.' : 'Seleccioná el texto y copialo con Ctrl+C.'; };
      try { navigator.clipboard.writeText(t.textContent).then(() => done(true), () => { selectText(t); done(false); }); }
      catch (_) { selectText(t); done(false); }
    };
  }
  // Propuestas por formulario externo (Google Forms): se usa cuando datos.js tiene propuestas.formulario
  function renderPropuestasFormulario(pre) {
    const g = pre.guia && byId[pre.guia];
    let url = P.formulario;
    if (g && P.formularioCampoGuia) url += (url.includes('?') ? '&' : '?') + 'usp=pp_url&' + encodeURIComponent(P.formularioCampoGuia) + '=' + encodeURIComponent(g.titulo);
    const plan = P.plan || [];
    view.innerHTML = `
      <div class="crumbs"><button type="button" data-go="">Inicio</button><span>/</span><span>Propuestas de mejora</span></div>
      <div class="g-head"><h1>Propuestas de mejora</h1>
        <p class="lead">¿Qué necesitás ver o hacer en el GEST que todavía no está en la guía? ¿Encontraste algo mal? Contalo en el formulario y se tiene en cuenta para la próxima actualización.</p></div>
      <div class="panel guide-prop" style="border-top:1px solid var(--line)">
        <div><b>${g ? 'Propuesta sobre: ' + esc(g.titulo) : 'Formulario de propuestas'}</b><p class="hint">Se abre en otra pestaña. Lleva dos minutos.</p></div>
        <a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir el formulario</a>
      </div>
      <section><h2>Próximas actualizaciones</h2>
        <div class="panel">${plan.length ? `<div class="road">${plan.map(r => `<div class="road-row"><b>${esc(r.titulo)}</b><span class="state ${esc(r.estado)}">${esc(ESTADOS[r.estado] || r.estado)}</span><small>${esc(r.detalle || '')}${r.pedido ? ' · Pedido por ' + esc(r.pedido) : ''}</small></div>`).join('')}</div>`
          : `<p class="empty">Todavía no hay mejoras planificadas.</p>`}</div>
      </section>`;
    renderNav('propuestas');
  }

  let bandejaFiltro = 'abiertas';
  async function renderBandeja() {
    view.innerHTML = `
      <div class="crumbs"><button type="button" data-go="">Inicio</button><span>/</span><button type="button" data-go="propuestas">Propuestas de mejora</button><span>/</span><span>Bandeja</span></div>
      <div class="g-head"><h1>Bandeja de propuestas</h1><p class="lead">Todo lo que propusieron los usuarios. Cambiá el estado a medida que lo incorporás. El registro completo está en <span class="source">propuestas\\propuestas.csv</span> (se abre con Excel).</p></div>
      <div class="panel" id="b-panel"><p class="empty">Cargando…</p></div>`;
    renderNav('propuestas');
    const panel = document.getElementById('b-panel');
    if (!(await hayRegistro())) { panel.innerHTML = `<p class="empty">La bandeja solo funciona abriendo la guía desde el servidor (${esc(P.direccion || 'http://SERVIDOR:8080')}).</p>`; return; }
    let d;
    try { d = await (await fetch(API, { cache: 'no-store' })).json(); } catch (_) { panel.innerHTML = '<p class="empty">No se pudo leer el registro. Revisá que el servidor esté encendido.</p>'; return; }
    const draw = () => {
      let rows = d.propuestas.slice().reverse();
      if (bandejaFiltro === 'abiertas') rows = rows.filter(x => !['Hecha', 'Descartada'].includes(x.estado));
      else if (bandejaFiltro !== 'todas') rows = rows.filter(x => x.estado === bandejaFiltro);
      const cnt = e => d.propuestas.filter(x => x.estado === e).length;
      panel.innerHTML = `
        <div class="filters">${[['abiertas', 'Sin resolver'], ['todas', 'Todas'], ...d.estados.map(e => [e, e])].map(([v, t]) =>
          `<button type="button" class="sector" data-bfilt="${esc(v)}" aria-pressed="${bandejaFiltro === v}">${esc(t)}${d.estados.includes(v) ? ' · ' + cnt(v) : ''}</button>`).join('')}</div>
        ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Propuesta</th><th>De</th><th>Importancia</th><th>Estado</th></tr></thead><tbody>
          ${rows.map(x => `<tr><td class="num">${esc(x.fecha)}<br><span class="source">#${esc(x.id)}</span></td>
            <td><b>${esc(x.tipo)}</b> · ${esc(x.guia)}<br>${esc(x.descripcion)}</td>
            <td>${esc(x.nombre || '—')}<br><small class="hint">${esc(x.sector || '')}</small></td>
            <td>${esc(x.importancia)}</td>
            <td><select class="b-estado" data-id="${esc(x.id)}" aria-label="Estado de la propuesta ${esc(x.id)}">${d.estados.map(e => `<option${e === x.estado ? ' selected' : ''}>${e}</option>`).join('')}</select></td></tr>`).join('')}
          </tbody></table></div>` : '<p class="empty">No hay propuestas en este filtro.</p>'}`;
    };
    draw();
    panel.addEventListener('click', e => { const b = e.target.closest('[data-bfilt]'); if (b) { bandejaFiltro = b.dataset.bfilt; draw(); } });
    panel.addEventListener('change', async e => {
      const sel = e.target.closest('.b-estado'); if (!sel) return;
      try {
        const r = await fetch(`${API}/${sel.dataset.id}/estado`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: sel.value }) });
        if (!r.ok) throw 0;
        d.propuestas.find(x => x.id === sel.dataset.id).estado = sel.value; draw();
      } catch (_) { sel.insertAdjacentHTML('afterend', '<br><small class="hint">No se guardó</small>'); }
    });
  }

  function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === 'propuestas') renderPropuestas();
    else if (h === 'bandeja') renderBandeja();
    else if (byId[h]) renderGuide(byId[h]);
    else if (h.startsWith('m-') && D.modulos.find(m => m.id === h.slice(2))) renderModule(D.modulos.find(m => m.id === h.slice(2)));
    else renderHome();
    document.getElementById('side').classList.remove('open');
    window.scrollTo(0, 0);
  }
  function go(id) { if (location.hash.slice(1) === id) route(); else location.hash = id; }

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-img],[data-sector],[data-prop-guia]');
    if (!t) return;
    if (t.dataset.propGuia) { propPrefill = { guia: t.dataset.propGuia, tipo: 'corregir' }; go('propuestas'); return; }
    if (t.dataset.img) { document.getElementById('viewer-img').src = t.dataset.img; document.getElementById('viewer').hidden = false; return; }
    if (t.dataset.sector) { sectorFilter = sectorFilter === t.dataset.sector ? null : t.dataset.sector; renderHome(); return; }
    if (t.hasAttribute('data-go')) go(t.dataset.go);
  });
  document.getElementById('viewer').onclick = () => { document.getElementById('viewer').hidden = true; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('viewer').hidden = true; });
  document.getElementById('home-btn').onclick = () => { search.value = ''; sectorFilter = null; go(''); };
  document.getElementById('menu-toggle').onclick = e => {
    const s = document.getElementById('side'); s.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', s.classList.contains('open'));
  };
  search.addEventListener('input', () => { if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} } renderHome(); });
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
