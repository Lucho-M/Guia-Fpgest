# Opción con Docker: la carpeta de la guía se monta en /guia.
# En el servidor usa F:/Emmegisoft/FPGEST_DATA/Guia_FPGEST. Para probar en otra PC: GUIA_DIR=../web docker compose up -d --build
services:
  guia-fpgest:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - "${GUIA_DIR:-F:/Emmegisoft/FPGEST_DATA/Guia_FPGEST}:/guia"
    restart: unless-stopped
